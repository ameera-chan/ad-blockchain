# Organizer-side stack: the attack verifier (scoring authority).
# The per-team services are launched separately (one container per team).
services:
  verifier:
    build: ./verifier
    ports:
      - "9090:9090"
    volumes:
      # teams.json is read-only (the verifier never mutates it; register.js
      # writes it on the host at deploy time).
      - ./verifier/teams.json:/app/teams.json:ro
      # flags.json is read-write so the verifier's admin POST /flag endpoint
      # (called by the GZCTF checker each tick) can persist the current flag.
      - ./verifier/flags.json:/app/flags.json
    environment:
      - PORT=9090
      - TEAMS_FILE=/app/teams.json
      - FLAGS_FILE=/app/flags.json
      # Organizer-only endpoints (/teams, /status, /flag) are gated by this
      # token. The GZCTF checker passes the same token as VERIFIER_ADMIN_TOKEN.
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set ADMIN_TOKEN before composing up}
    restart: unless-stopped
