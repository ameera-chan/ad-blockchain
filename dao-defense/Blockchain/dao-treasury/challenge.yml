name: dao-treasury
author: ac
description: >
  DAO Treasury Defense is an Attack–Defense blockchain service. Each team
  receives an isolated persistent EVM environment with five independent
  vulnerability paths. Defenders deploy patched implementations behind stable
  proxies while preserving legitimate DAO, lending, staking, gauge, and
  treasury behavior.
type: AttackDefense
category: Blockchain

container:
  memoryLimit: 1024
  cpuCount: 2
  storageLimit: 1024
  exposePort: 8080

ad:
  allowEgress: false
  allowSelfReset: true
  sshRequiresFlag: false
  selfHosted: false
