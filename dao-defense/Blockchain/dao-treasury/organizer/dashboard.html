<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAO Treasury — organizer status</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #0b0e14; color: #d7dce4; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: #7a8494; margin: 0 0 20px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1c222e; vertical-align: top; }
  th { color: #8b96a7; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .addr { color: #6fb1ff; }
  .rpc { color: #7bd88f; }
  .badge { display: inline-block; margin: 1px 3px 1px 0; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
  .exploited { background: #14341c; color: #5fe08a; }
  .open { background: #2a1f1f; color: #b86a6a; }
  .err { color: #e06c75; }
</style>
</head>
<body>
<h1>DAO Treasury Defense — organizer status</h1>
<p class="sub">Private organizer view. Reads the verifier's registry (/teams) and /status — no hard-coded team targets.</p>
<table>
  <thead><tr>
    <th>Team</th><th>RPC</th><th>Proxies</th><th>Exploited</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const VERIFIER = "http://127.0.0.1:9090";
const TOKEN = ""; // set to the verifier's ADMIN_TOKEN in production
const VULNS = ["oracle", "gauge", "batch", "ghost", "sandwich"];
const PROXIES = ["treasury", "governor", "lending", "legacyGauge", "mirror"];

const short = (a) => a ? `${a.slice(0, 6)}…${a.slice(-4)}` : "—";
const authHeaders = TOKEN ? { "Authorization": `Bearer ${TOKEN}` } : {};

async function load() {
  let teams, status;
  try {
    teams = await fetch(`${VERIFIER}/teams`, { headers: authHeaders }).then(r => r.json());
    status = await fetch(`${VERIFIER}/status`, { headers: authHeaders }).then(r => r.json()).catch(() => ({}));
  } catch (e) {
    document.getElementById("rows").innerHTML = `<tr><td class="err" colspan="4">verifier unreachable at ${VERIFIER}</td></tr>`;
    return;
  }
  const rows = Object.entries(teams).map(([name, t]) => {
    const c = t.contracts || {};
    const proxies = PROXIES.map((k) => c[k] ? `<span class="addr" title="${c[k]}">${short(c[k])}</span>` : "—").join(" ");
    const exploited = (status[name] || {});
    const badges = VULNS.map((v) =>
      `<span class="badge ${exploited[v] ? "exploited" : "open"}">${exploited[v] ? "✓" : "✗"} ${v}</span>`
    ).join("");
    return `<tr><td>${name}</td><td><span class="rpc">${t.rpc}/rpc</span></td><td>${proxies}</td><td>${badges}</td></tr>`;
  });
  document.getElementById("rows").innerHTML = rows.join("");
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
